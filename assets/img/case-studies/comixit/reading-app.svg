  <circle cx="260" cy="319" r="48" fill="#e56717" />
  <text x="260" y="327" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">AI</text>

  <path d="M328 315 h26 v-7 l14 11 -14 11 v-7 h-26 z" fill="#f2a05a" />

