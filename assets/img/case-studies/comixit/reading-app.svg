  <text x="260" y="242" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">How It Works: Comic Reformatting Engine</text>

  <!-- The publisher's file: a page of flowed lines. -->
  <rect x="52" y="264" width="92" height="110" rx="8" fill="#fbdcc2" />
  <rect x="66" y="282" width="64" height="8" rx="4" fill="#f2a05a" />
