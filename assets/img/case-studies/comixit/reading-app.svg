<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 578" width="520" height="578" role="img"
  font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="520" height="578" rx="18" fill="#3d1706" />

  <text x="260" y="46" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Comixit Reading App</text>
  <text x="260" y="70" text-anchor="middle" font-size="12" fill="#f3d9c6">Live · iOS &amp; Android · UK</text>

  <rect x="18" y="92" width="152" height="110" rx="10" fill="#fbdcc2" />
  <text x="94" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#4a1e05">Disney &amp;</text>
  <text x="94" y="156" text-anchor="middle" font-size="15" font-weight="700" fill="#4a1e05">Beano</text>
