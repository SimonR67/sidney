<?xml version="1.0" encoding="UTF-8"?>
<!-- The "Group Performance Dashboard" panel from cases/Professional-Services.pdf,
     rebuilt shape for shape in the papaya palette recorded in
     specs/4bc05d6f-e783-43e8-a21e-807feef4dbc6/notes.md. Every word and every
     figure in it is the panel's own; the four ring steps are separated by a 2px
     gap of the panel itself and named in the legend, so no segment is told apart
     by its colour alone. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 596" width="520" height="596" role="img"
  font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="520" height="596" rx="18" fill="#3d1706" />

  <text x="260" y="46" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Group Performance Dashboard</text>
  <text x="260" y="70" text-anchor="middle" font-size="12" fill="#f3d9c6">Live · All Regions · Updated 09:41</text>

  <rect x="18" y="92" width="152" height="96" rx="10" fill="#fbdcc2" />
  <text x="94" y="140" text-anchor="middle" font-size="22" font-weight="700" fill="#4a1e05">£48.2M</text>
  <text x="94" y="166" text-anchor="middle" font-size="10" fill="#4a1e05">Group Revenue</text>

  <rect x="184" y="92" width="152" height="96" rx="10" fill="#fbdcc2" />
  <text x="260" y="140" text-anchor="middle" font-size="22" font-weight="700" fill="#4a1e05">22.4%</text>
  <text x="260" y="166" text-anchor="middle" font-size="10" fill="#4a1e05">Profit Margin</text>

  <rect x="350" y="92" width="152" height="96" rx="10" fill="#fbdcc2" />
  <text x="426" y="140" text-anchor="middle" font-size="22" font-weight="700" fill="#4a1e05">87%</text>
  <text x="426" y="166" text-anchor="middle" font-size="10" fill="#4a1e05">Utilisation</text>

  <text x="18" y="228" font-size="13" font-weight="700" fill="#ffffff">Revenue vs Forecast, by Quarter</text>

  <!-- Actual beside forecast, quarter by quarter, on one scale. -->
  <rect x="60" y="294" width="34" height="62" rx="4" fill="#fbdcc2" />
  <rect x="96" y="298" width="34" height="58" rx="4" fill="#e56717" />
  <rect x="165" y="284" width="34" height="72" rx="4" fill="#fbdcc2" />
  <rect x="201" y="290" width="34" height="66" rx="4" fill="#e56717" />
  <rect x="270" y="272" width="34" height="84" rx="4" fill="#fbdcc2" />
  <rect x="306" y="276" width="34" height="80" rx="4" fill="#e56717" />
  <rect x="375" y="262" width="34" height="94" rx="4" fill="#fbdcc2" />
  <rect x="411" y="266" width="34" height="90" rx="4" fill="#e56717" />
  <line x1="24" y1="357" x2="496" y2="357" stroke="#f3d9c6" stroke-width="1" />

  <text x="95" y="376" text-anchor="middle" font-size="10.5" fill="#f3d9c6">Q1</text>
  <text x="200" y="376" text-anchor="middle" font-size="10.5" fill="#f3d9c6">Q2</text>
  <text x="305" y="376" text-anchor="middle" font-size="10.5" fill="#f3d9c6">Q3</text>
  <text x="410" y="376" text-anchor="middle" font-size="10.5" fill="#f3d9c6">Q4</text>

  <rect x="176" y="392" width="9" height="9" rx="2" fill="#fbdcc2" />
  <text x="191" y="400" font-size="10" fill="#f3d9c6">Actual (£M)</text>
  <rect x="262" y="392" width="9" height="9" rx="2" fill="#e56717" />
  <text x="277" y="400" font-size="10" fill="#f3d9c6">Forecast (£M)</text>

  <text x="18" y="442" font-size="13" font-weight="700" fill="#ffffff">Utilisation by Region</text>

  <!-- One ring, four steps of the one hue, each cut from the next by 2px of panel. -->
  <circle cx="96" cy="512" r="42" fill="none" stroke="#fbdcc2" stroke-width="20"
    stroke-dasharray="98.28 165.61" stroke-dashoffset="0" transform="rotate(-90 96 512)" />
  <circle cx="96" cy="512" r="42" fill="none" stroke="#f2a05a" stroke-width="20"
    stroke-dasharray="63.97 199.92" stroke-dashoffset="-100.28" transform="rotate(-90 96 512)" />
  <circle cx="96" cy="512" r="42" fill="none" stroke="#d95a12" stroke-width="20"
    stroke-dasharray="56.06 207.83" stroke-dashoffset="-166.25" transform="rotate(-90 96 512)" />
  <circle cx="96" cy="512" r="42" fill="none" stroke="#7a3208" stroke-width="20"
    stroke-dasharray="37.58 226.31" stroke-dashoffset="-224.31" transform="rotate(-90 96 512)" />

  <rect x="176" y="466" width="9" height="9" rx="2" fill="#fbdcc2" />
  <text x="191" y="474" font-size="10" fill="#f3d9c6">EU</text>
  <rect x="176" y="490" width="9" height="9" rx="2" fill="#f2a05a" />
  <text x="191" y="498" font-size="10" fill="#f3d9c6">USA</text>
  <rect x="176" y="514" width="9" height="9" rx="2" fill="#d95a12" />
  <text x="191" y="522" font-size="10" fill="#f3d9c6">UK</text>
  <rect x="176" y="538" width="9" height="9" rx="2" fill="#7a3208" />
  <text x="191" y="546" font-size="10" fill="#f3d9c6">Asia</text>
</svg>
